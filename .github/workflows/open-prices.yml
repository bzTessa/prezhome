# Importa cada semana los precios de referencia de Open Prices (Open Food
# Facts) a la tabla market_prices de Supabase (scripts/open_prices_sync.py) y
# los catálogos de Mercadona, Dia, Consum, bonÀrea, Lidl, REWE, Ahorramás,
# Pingo Doce y Auchan Portugal a supermarket_products (scripts/*_sync.py).
#
# Secrets (Settings -> Secrets and variables -> Actions):
#   SUPABASE_PROJECT_REF       (ya existe, lo usa deploy.yml)
#   SUPABASE_SERVICE_ROLE_KEY  (nuevo; ver docs/CI_CD_SECRETS.md)
name: Importar precios de Open Prices

on:
  schedule:
    - cron: "0 5 * * 1" # lunes a las 05:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  importar:
    runs-on: ubuntu-latest
    timeout-minutes: 60 # bonÀrea (~20 min) y Lidl (~12 min, 5 países) leen fichas una a una
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Importar precios
        env:
          SUPABASE_URL: https://${{ secrets.SUPABASE_PROJECT_REF }}.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/open_prices_sync.py
      - name: Importar catálogo de Mercadona
        # Cada súper por su cuenta: si uno falla, los demás se importan igual.
        if: ${{ !cancelled() }}
        env:
          SUPABASE_URL: https://${{ secrets.SUPABASE_PROJECT_REF }}.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/mercadona_sync.py
      - name: Importar catálogo de REWE (Alemania)
        if: ${{ !cancelled() }}
        env:
          SUPABASE_URL: https://${{ secrets.SUPABASE_PROJECT_REF }}.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/rewe_sync.py
      - name: Importar catálogo de Dia
        if: ${{ !cancelled() }}
        env:
          SUPABASE_URL: https://${{ secrets.SUPABASE_PROJECT_REF }}.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/dia_sync.py
      - name: Importar catálogo de Consum
        if: ${{ !cancelled() }}
        env:
          SUPABASE_URL: https://${{ secrets.SUPABASE_PROJECT_REF }}.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/consum_sync.py
      - name: Importar catálogo de bonÀrea
        if: ${{ !cancelled() }}
        env:
          SUPABASE_URL: https://${{ secrets.SUPABASE_PROJECT_REF }}.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/bonarea_sync.py
      - name: Importar productos de Lidl (España, Francia, Italia, Alemania, Portugal)
        if: ${{ !cancelled() }}
        env:
          SUPABASE_URL: https://${{ secrets.SUPABASE_PROJECT_REF }}.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        # Un país caído no frena a los demás, pero el paso acaba en rojo.
        run: |
          fail=0
          for c in es fr it de pt; do python scripts/lidl_sync.py $c || fail=1; done
          exit $fail

  # Fichas de producto una a una (JSON-LD): cada súper en su propio trabajo,
  # en paralelo, porque los grandes tardan más de una hora.
  fichas:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        store: [ahorramas, pingodoce, auchan]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Importar ${{ matrix.store }}
        env:
          SUPABASE_URL: https://${{ secrets.SUPABASE_PROJECT_REF }}.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/jsonld_sync.py ${{ matrix.store }}

# Importa cada semana los precios de referencia de Open Prices (Open Food
# Facts) a la tabla market_prices de Supabase. Ver scripts/open_prices_sync.py.
#
# Secrets (Settings -> Secrets and variables -> Actions):
#   SUPABASE_PROJECT_REF       (ya existe, lo usa deploy.yml)
#   SUPABASE_SERVICE_ROLE_KEY  (nuevo; ver docs/CI_CD_SECRETS.md)
name: Importar precios de Open Prices

on:
  schedule:
    - cron: "0 5 * * 1" # lunes a las 05:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  importar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Importar precios
        env:
          SUPABASE_URL: https://${{ secrets.SUPABASE_PROJECT_REF }}.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/open_prices_sync.py
